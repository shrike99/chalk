name: Release

# Push a tag like v2.0.0 to build the Windows installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Chalk-installer
          path: desktop/dist/Chalk-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Chalk-Setup-*.exe
          generate_release_notes: true
